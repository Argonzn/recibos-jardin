function siguienteMes(m){const [y,mm]=m.split('-').map(Number);const d=new Date(y,mm-1+1,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}

/* ---------- Agua (Sedapal) ---------- */
// Reparto del recibo de agua:
//  · Deptos con medidor: pagan su consumo medido, más su parte proporcional de lo que queda sin medir.
//  · Deptos sin medidor (Yeni): una base fija de m³ más el EXCESO cuando el agua sin medir del mes se sale de lo
//    normal (mediana de los 6 meses previos + su desviación típica, con un mínimo de 3 m³).
//  · Cargos por pagar tarde (mora, corte, reapertura con IGV): aparte, solo a quienes pagaron tarde el mes anterior.
let aguaRecibos=[],lecturasAgua=[],cobros=[],cargosMes=[];
const IGV_ATRASO=0.18;
const r2=n=>Math.round((Number(n)||0)*100)/100;
const tipoAgua=d=>d&&d.agua?d.agua:'medidor'; // 'medidor' | 'sin_medidor' | 'no'
const lecturaAguaDe=(dep,mes)=>lecturasAgua.find(l=>l.deptoId===dep&&l.mes===mes);
const lecturasAguaDe=dep=>lecturasAgua.filter(l=>l.deptoId===dep).sort((a,b)=>a.mes.localeCompare(b.mes));
function m3De(l){if(!l)return null;if(l.m3!=null&&l.m3!=='')return Number(l.m3);if(l.lecturaActual!=null&&l.lecturaAnterior!=null)return Number(l.lecturaActual)-Number(l.lecturaAnterior);return null}
const atrasoDe=r=>r2((Number(r.mora)||0)+((Number(r.cierre)||0)+(Number(r.reapertura)||0))*(1+IGV_ATRASO));
const consumoAguaDe=r=>r2((Number(r.total)||0)-atrasoDe(r));
function mediana(a){const s=[...a].sort((x,y)=>x-y),n=s.length;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2}
function desviacion(a){if(a.length<2)return 0;const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))}
const deptosConMedidor=()=>deptos.filter(d=>tipoAgua(d)==='medidor');
const deptosSinMedidor=()=>deptos.filter(d=>tipoAgua(d)==='sin_medidor');
const deptosConAgua=()=>deptos.filter(d=>tipoAgua(d)!=='no');
const primerMesAgua=()=>aguaRecibos.map(r=>r.id).sort()[0]||null;
function mesAnterior(m){const [y,mm]=m.split('-').map(Number);const d=new Date(y,mm-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
const nombreDepto=d=>d?tituloDepto(d)+(d.encargado?' · '+d.encargado:''):'';

// Agua sin medir de un mes: medidor general (lectura propia del día 12 si existe; si no, la del recibo) menos la suma de los medidores internos.
function sinMedirAgua(mes){
  const r=aguaRecibos.find(x=>x.id===mes);
  const con=deptosConMedidor();
  const faltan=con.filter(d=>m3De(lecturaAguaDe(d.id,mes))==null);
  if(faltan.length)return{incompleto:true,faltan};
  const medidos=sum(con,d=>m3De(lecturaAguaDe(d.id,mes)));
  const propio=m3De(lecturaAguaDe('general',mes));
  const general=propio!=null?propio:(r&&r.m3!=null?Number(r.m3):null);
  if(general==null||general<=0)return{incompleto:true,faltan:[],sinRecibo:true};
  return{general,fuente:propio!=null?'propia':'recibo',medidos,R:general-medidos};
}
// Memorizado por mes: los cobros lo consultan muchas veces por pantalla. Se limpia cada vez que llegan datos.
function calcAgua(mes){const m=calcAgua.memo||(calcAgua.memo={});if(!(mes in m))m[mes]=calcAguaCalc(mes);return m[mes]}
function calcAguaCalc(mes){
  const r=aguaRecibos.find(x=>x.id===mes);if(!r)return null;
  const s=sinMedirAgua(mes);
  if(s.incompleto)return{r,incompleto:true,faltan:s.faltan||[]};
  const hist=[];
  for(const m of aguaRecibos.map(x=>x.id).filter(m=>m<mes).sort().reverse()){const x=sinMedirAgua(m);if(!x.incompleto)hist.push(x.R);if(hist.length>=6)break}
  const base=cargosDe(mes).base;
  const sinMed=deptosSinMedidor();
  let normal=null,tol=null,exceso=0;
  if(hist.length>=3){normal=mediana(hist);tol=Math.max(3,desviacion(hist));exceso=Math.max(0,s.R-(normal+tol))}
  const m3SinMed=sinMed.length?Math.min(s.general/sinMed.length,base+exceso/sinMed.length):0;
  const restante=Math.max(0,s.general-m3SinMed*sinMed.length);
  const factor=s.medidos>0?restante/s.medidos:0;
  const consumo=consumoAguaDe(r),atraso=atrasoDe(r);
  const porDepto={};
  deptosConAgua().forEach(d=>{
    const conMed=tipoAgua(d)==='medidor';
    const m3Leido=conMed?m3De(lecturaAguaDe(d.id,mes)):null;
    const m3=conMed?m3Leido*factor:m3SinMed;
    porDepto[d.id]={m3Leido,m3,agua:consumo*m3/s.general,atraso:0};
  });
  const resp=responsablesAtraso(mes);
  // El atraso lo pagan quienes aún no cancelan el mes anterior (ver responsablesMora). Si nadie, no se cobra a ningún depto
  // (lo asume la administración) y queda como "sin responsable".
  let atrasoSinResponsable=0;
  if(atraso>0){const ids=resp.ids.filter(id=>porDepto[id]);if(ids.length)ids.forEach(id=>{porDepto[id].atraso=atraso/ids.length});else atrasoSinResponsable=atraso}
  return{r,general:s.general,fuente:s.fuente,medidos:s.medidos,R:s.R,pct:s.R/s.general,nHist:hist.length,normal,tol,exceso,base,
    m3SinMed,factor,consumo,atraso,atrasoSinResponsable,precio:consumo/s.general,porDepto,resp,fueraDeLoNormal:exceso>0};
}
// Los cargos por atraso del recibo de un mes se deben a pagar tarde el recibo anterior.
// Automático: deptos que no pagaron, o pagaron después del corte interno, el cobro del mes anterior.
// Manual: se guarda en el recibo como {manual:true, ids:[...]}.
// ¿Canceló el depto ese mes? Solo cuenta el pago completo registrado (un pago parcial no).
// En la luz también vale el cobro de solo luz de antes del módulo de agua; si no tuvo lectura de luz, no debía nada.
function cancelo(dep,mes,servicio){
  const c=cobroDe(dep,mes);if(c&&c.montoCobrado!=null)return c.tipoPago!=='parcial';
  if(servicio==='luz'){const l=lecturaDe(dep,mes);return !l||l.montoCobrado!=null}
  return false;
}
function pagoTardeDe(dep,mes){const c=cobroDe(dep,mes);if(!c||c.montoCobrado==null)return false;if(typeof c.pagoTarde==='boolean')return c.pagoTarde;return !!(c.fechaCobro&&c.fechaCobro>fechaLimitePago(mes))}
// La mora de un recibo viene de no pagar a tiempo el anterior. Se reparte en partes iguales entre los deptos que todavía
// no cancelan su cobro del mes anterior: en cuanto uno registra su pago completo, sale del reparto y los demás lo absorben.
// Si ya todos pagaron, la cargan quienes pagaron fuera de fecha; si tampoco hay, no se cobra (lo asume la administración).
function responsablesMora(mes,participantes,servicio){
  const prev=mesAnterior(mes);
  let ids=participantes.filter(id=>!cancelo(id,prev,servicio));if(ids.length)return{ids,fuente:'pendientes'};
  ids=participantes.filter(id=>pagoTardeDe(id,prev));return{ids,fuente:ids.length?'tarde':'nadie'};
}
function responsablesAtraso(mes){
  const r=aguaRecibos.find(x=>x.id===mes);
  const g=r&&r.responsablesAtraso;
  if(g&&!Array.isArray(g)&&g.manual)return{ids:g.ids||[],fuente:'manual'};
  return responsablesMora(mes,deptosConAgua().map(d=>d.id),'agua');
}
// Intereses por atraso del recibo de luz: el compensatorio va antes del IGV (lo lleva); el moratorio no.
const atrasoLuzDe=r=>r2((Number(r.interesCompensatorio)||0)*(1+IGV_ATRASO)+(Number(r.interesMoratorio)||0));
function responsablesLuz(mes){
  const m=calcAgua.memo||(calcAgua.memo={}),k='luz:'+mes;
  if(!(k in m))m[k]=responsablesMora(mes,deptos.filter(d=>{const l=lecturaDe(d.id,mes);return l&&l.kwh!=null}).map(d=>d.id),'luz');
  return m[k];
}

/* ---------- Cobro del mes (luz + agua + administración) ---------- */
const cobroDe=(dep,mes)=>cobros.find(c=>c.deptoId===dep&&c.mes===mes);
function cargosDe(mes){
  const c=cargosMes.find(x=>x.id===mes);const v=(x,def)=>x!=null&&x!==''?Number(x):def;
  return{admLuz:v(c&&c.admLuz,Number(config.mantenimiento??5)),admAgua:v(c&&c.admAgua,Number(config.admAgua??5)),mant:v(c&&c.mant,Number(config.mantExtra??0)),base:v(c&&c.base,Number(config.baseSinMedidor??7)),propio:!!c};
}
function mesesCobro(){return[...new Set([...recibos.map(r=>r.id),...aguaRecibos.map(r=>r.id),...lecturas.map(l=>l.mes)])].sort()}
// Saldo a favor: si un mes se pagó de más (tipoPago 'demas'), el exceso se descuenta del mes siguiente (en cadena).
function creditoEntrante(dep,mes,prof=0){
  if(prof>24)return 0;
  const prev=mesAnterior(mes),c=cobroDe(dep,prev);
  if(!c||c.tipoPago!=='demas'||c.montoCobrado==null)return 0;
  return r2(Math.max(0,Number(c.montoCobrado)-detalleCobro(dep,prev,prof+1).neto));
}
// Meses anteriores al sistema: quedan cerrados con lo que pagó cada uno (suman exacto los recibos), sin recalcular.
const MES_INICIO_CALCULO='2026-04';
const mesCerrado=mes=>mes<MES_INICIO_CALCULO;
function detalleCobro(dep,mes,prof=0){
  if(mesCerrado(mes)){
    const d=deptos.find(x=>x.id===dep),c=cobroDe(dep,mes),cobrado=c&&c.montoCobrado!=null?Number(c.montoCobrado):null;
    return{d,mes,cerrado:true,partes:{luz:null,agua:null,admLuz:0,admAgua:0,mant:0,atraso:0,atrasoAgua:0,atrasoLuz:0},total:cobrado||0,aFavor:0,neto:cobrado||0,faltan:[],
      cobro:c,cobrado,legado:null,pagado:cobrado||0,falta:0,diferencia:null,estado:{cls:'ok',txt:'Pagado'+(c&&c.pagoTarde===true?' · fuera de fecha':'')},participa:cobrado!=null};
  }
  const d=deptos.find(x=>x.id===dep);const car=cargosDe(mes);
  const lz=lecturaDe(dep,mes);const usaLuz=!!lz;
  const pm=primerMesAgua();const usaAgua=tipoAgua(d)!=='no'&&pm&&mes>=pm;
  const vl=usaLuz?calcVerif(dep,mes):null;
  const ca=usaAgua?calcAgua(mes):null;const pa=ca&&!ca.incompleto?ca.porDepto[dep]:null;
  const faltan=[];
  if(usaLuz&&!vl)faltan.push('recibo de luz');
  if(usaAgua&&!ca)faltan.push('recibo de agua');else if(usaAgua&&ca.incompleto)faltan.push('lecturas de agua');
  const partes={luz:vl?r2(vl.cargoElectricidad):null,agua:pa?r2(pa.agua):null,admLuz:usaLuz?car.admLuz:0,admAgua:usaAgua?car.admAgua:0,mant:(usaLuz||usaAgua)?car.mant:0,atrasoAgua:pa?r2(pa.atraso):0,atrasoLuz:vl?r2(vl.atrasoLuz):0};
  partes.atraso=r2(partes.atrasoAgua+partes.atrasoLuz);
  const total=r2((partes.luz||0)+(partes.agua||0)+partes.admLuz+partes.admAgua+partes.mant+partes.atraso);
  const aFavor=creditoEntrante(dep,mes,prof);
  const neto=r2(Math.max(0,total-aFavor)); // lo que realmente debe pagar este mes
  const c=cobroDe(dep,mes);
  const cobrado=c&&c.montoCobrado!=null?Number(c.montoCobrado):null;
  const legado=cobrado==null&&lz&&lz.montoCobrado!=null?Number(lz.montoCobrado):null; // cobro de solo luz registrado antes del módulo de agua
  const tarde=c&&c.pagoTarde===true?' · fuera de fecha':'';
  let estado;
  if(cobrado!=null&&c.tipoPago==='parcial')estado={cls:'pend',txt:'Pago parcial'+tarde};
  else if(cobrado!=null&&c.tipoPago==='demas')estado={cls:'ok',txt:'Cobrado · '+fmtS(Math.max(0,cobrado-neto))+' a favor'+tarde};
  else if(cobrado!=null)estado={cls:'ok',txt:'Cobrado'+tarde};
  else if(legado!=null)estado=usaAgua?{cls:'pend',txt:'Solo luz cobrada'}:{cls:'ok',txt:'Cobrado'};
  else if(aFavor>0&&neto===0&&!faltan.length)estado={cls:'ok',txt:'Cubierto con saldo a favor'};
  else{const dh=diasHasta(fechaLimitePago(mes));estado=dh!=null&&dh<0?{cls:'late',txt:'Atrasado'}:{cls:'pend',txt:'Pendiente'}}
  const pagado=cobrado??legado??0;
  return{d,mes,partes,total,aFavor,neto,faltan,cobro:c,cobrado,legado,pagado,
    falta:estado.cls==='ok'?0:r2(Math.max(0,neto-pagado)),
    diferencia:cobrado!=null&&c.tipoPago!=='parcial'&&c.tipoPago!=='demas'?r2(cobrado-neto):null,estado,participa:usaLuz||usaAgua};
}
function cobrosDelMes(mes){return deptos.slice().sort((a,b)=>(a.numero||0)-(b.numero||0)).map(d=>detalleCobro(d.id,mes)).filter(x=>x.participa)}
function cobrosPendientesTodos(){const out=[];mesesCobro().forEach(m=>cobrosDelMes(m).forEach(x=>{if(x.estado.cls!=='ok')out.push(x)}));return out}
async function guardarCobro(id,body,clave){body.actualizado=new Date().toISOString();await db.doc('cobros/'+id).set(body,clave)}
async function guardarCargosMes(mes,body){body.actualizado=new Date().toISOString();await db.doc('cargos/'+mes).set(body)}
async function guardarReciboAgua(id,body){body.actualizado=new Date().toISOString();await db.doc('agua_recibos/'+id).set(body)}

// "Pagó todo" con un toque: monto = lo que debe, fecha de hoy, a tiempo según el límite. Se puede deshacer.
async function pagoRapido(dep,mes){
  await esperarDatos();
  const x=detalleCobro(dep,mes);if(x.faltan.length){toast('Falta '+x.faltan.join(' y ')+': abre el cobro para revisarlo.');return}
  const hoy=new Date().toISOString().slice(0,10),c0=x.cobro;
  const monto=r2((c0&&c0.tipoPago==='parcial'&&c0.montoCobrado!=null?Number(c0.montoCobrado):0)+x.falta||x.neto);
  const hist=(c0&&Array.isArray(c0.historialCobro)?c0.historialCobro:[]).concat([{cuando:new Date().toISOString(),anterior:{monto:c0?c0.montoCobrado??null:null,fecha:c0?c0.fechaCobro??null:null},nuevo:{monto,fecha:hoy}}]);
  try{
    await guardarCobro(dep+'_'+mes,{deptoId:dep,mes,montoCobrado:monto,fechaCobro:hoy,nota:(c0&&c0.nota)||'',historialCobro:hist,pagoTarde:hoy>fechaLimitePago(mes),tipoPago:'completo'});
    toast(tituloDepto(x.d)+': '+fmtS(monto)+' cobrado',{accion:['📲 Comprobante',()=>enviarComprobante(dep,mes)]});
  }catch(e){toast('No se pudo guardar: '+(e.message||e.code))}
}

function renderCobros(){

  // Las dos preguntas se actualizan sin redibujar el formulario (no se pierde lo escrito).
  const pintarTipo=()=>{const t=tipoEfectivo();dlg.querySelectorAll('[data-tipo]').forEach(b=>b.classList.toggle('on',b.dataset.tipo===t));
    const m=data.monto;let txt;
    if(t==='parcial')txt=m!=null?`Queda pendiente <strong>${fmtS(Math.max(0,x.neto-m))}</strong> de ${mesLargo(mes)}; se podrá completar después. Mientras no lo complete, le toca una parte de la mora de ${mesLargo(mesSig)}.`:'Queda pendiente la diferencia; se podrá completar después.';
    else if(t==='demas')txt=m!=null?`<strong>${fmtS(Math.max(0,m-x.neto))}</strong> quedan a favor y se descuentan del cobro de ${mesLargo(mesSig)}.`:'Lo pagado de más se descuenta del cobro del mes siguiente.';
    else txt=`${mesLargo(mes)} queda saldado${m!=null&&Math.abs(m-x.neto)>=0.5?` (diferencia de ${fmtS(m-x.neto)} con lo calculado)`:''}.`;
    dlg.querySelector('#cm-tipo-info').innerHTML=txt+(data.tipo==null?' <span class="muted">(sugerido por el monto)</span>':'')};
  const pintarTarde=()=>{const t=tardeEfectivo();
    dlg.querySelector('[data-tarde="no"]').classList.toggle('on',!t);dlg.querySelector('[data-tarde="si"]').classList.toggle('on',t);
    dlg.querySelector('#cm-tarde-info').innerHTML=(t?`Pagó fuera de fecha. No carga la mora de <strong>${mesLargo(mesSig)}</strong> mientras haya deptos que aún no pagan ${mesLargo(mes)}; si al final todos pagan, la mora se reparte entre quienes pagaron tarde.`:`Pagó a tiempo: en <strong>${mesLargo(mesSig)}</strong> no le toca mora ni reconexión.`)
      +(data.tarde==null?' <span class="muted">(sugerido por la fecha)</span>':'')};
  inMonto.oninput=()=>{data.monto=num(inMonto.value);pintarTipo()};
  dlg.querySelector('#cm-total').onclick=()=>{inMonto.value=x.neto;data.monto=x.neto;pintarTipo()};

  dlg.querySelectorAll('[data-tarde]').forEach(b=>b.onclick=()=>{data.tarde=b.dataset.tarde==='si';pintarTarde()});
  dlg.querySelector('#cm-fecha').oninput=e=>{data.fecha=e.target.value;pintarTarde()};
  pintarTipo();pintarTarde();
  const guardarCon=async(monto,fecha,nota)=>{
    const h=hist.concat([{cuando:new Date().toISOString(),anterior:{monto:c0?c0.montoCobrado??null:null,fecha:c0?c0.fechaCobro??null:null},nuevo:{monto,fecha}}]);
    await guardarCobro(dep+'_'+mes,{deptoId:dep,mes,montoCobrado:monto,fechaCobro:fecha,nota,historialCobro:h,

  };
  const q=dlg.querySelector('#cm-quitar');if(q)q.onclick=async()=>{if(!(await confirmar('¿Quitar el cobro de '+tituloDepto(x.d)+' de '+mesLargo(mes)+'? Queda en el historial.','Quitar',true)))return;try{await guardarCon(null,null,data.nota);dlg.close();toast('Cobro quitado')}catch(e){toast('No se pudo guardar: '+(e.message||e.code))}};
  dlg.querySelector('#cm-save').onclick=async()=>{
    const monto=num(inMonto.value),fecha=dlg.querySelector('#cm-fecha').value||null,nota=dlg.querySelector('#cm-nota').value.trim();

    data.monto=monto;
    const btn=dlg.querySelector('#cm-save');btn.disabled=true;btn.textContent='Guardando…';
    try{await guardarCon(monto,fecha,nota);dlg.close();toast('Cobro registrado',{accion:['📲 Comprobante',()=>enviarComprobante(dep,mes)]})}catch(e){btn.disabled=false;btn.textContent='Guardar';toast('No se pudo guardar: '+(e.message||e.code))}
  };
  dlg.showModal();
}

/* ---------- Recibo de agua: lectura del PDF y formulario ---------- */
const CAMPOS_AGUA=[
 {k:'mes',l:'Mes facturado',t:'month'},{k:'recibo',l:'N° de recibo',t:'text'},{k:'emision',l:'Fecha de emisión',t:'date'},{k:'vencimiento',l:'Fecha de vencimiento',t:'date'},
 {k:'periodoInicio',l:'Periodo: desde',t:'date'},{k:'periodoFin',l:'Periodo: hasta',t:'date'},{k:'lecturaAnterior',l:'Lectura anterior (general)',t:'num'},{k:'lecturaActual',l:'Lectura actual (general)',t:'num'},
 {k:'m3',l:'Consumo (m³)',t:'num'},{k:'volumen',l:'Volumen de agua potable',t:'num'},{k:'alcantarillado',l:'Servicio de alcantarillado',t:'num'},{k:'cargoFijo',l:'Cargo fijo',t:'num'},
 {k:'cierre',l:'Costo de cierre',t:'num'},{k:'reapertura',l:'Costo de reapertura',t:'num'},{k:'mora',l:'Mora',t:'num'},{k:'igv',l:'IGV',t:'num'},
 {k:'redondeoAnterior',l:'Redondeo mes anterior',t:'num'},{k:'redondeoActual',l:'Redondeo mes actual',t:'num'},{k:'total',l:'Importe total a pagar',t:'num'},
];
const REQ_AGUA=['mes','m3','total','vencimiento'];
const fechaDMY=s=>{const m=String(s||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?`${m[3]}-${m[2]}-${m[1]}`:null};
// El PDF de Sedapal trae el detalle como "etiquetas… Consumo del mes" seguido de todos los montos en el mismo orden.
const CONCEPTOS_AGUA=[
 ['Volumen de Agua Potable(?:\\s+[\\d.]+\\s*m3)?','volumen'],['Servicio de Alcantarillado','alcantarillado'],['Cargo Fijo','cargoFijo'],
 ['Costo (?:de )?Cierre(?:\\s+\\d+\\s*mm)?','cierre'],['Costo de Reapertura(?:\\s+\\d+\\s*mm)?','reapertura'],['I\\.G\\.V\\.(?:\\s+[\\d.,]+\\s*x\\s*18%)?','igv'],
 ['Descuentos? por mora calculada','otros:Descuento por mora calculada'],['Mora','mora'],['Redondeo del mes anterior','redondeoAnterior'],
 ['Redondeo del mes actual','redondeoActual'],['Consumo del mes','total'],
];
function parseReciboAgua(t){
  t=t.replace(/\s+/g,' ');const r={otros:[],cierre:0,reapertura:0,mora:0};let m;
  if(/CONVENIO DE PAGO/i.test(t))return{convenio:true};
  if(m=t.match(/\b(S\d{3}-\d{6,})/))r.recibo=m[1];
  if(m=t.match(/Suministro\s+(\d{5,9}-\d)/i))r.suministro=m[1];
  if(m=t.match(/Mes facturado:?\s*(Enero|Febrero|Marzo|Abril|Mayo|Junio|Julio|Agosto|Setiembre|Septiembre|Octubre|Noviembre|Diciembre)\s+(\d{4})/i)){let x=m[1].toLowerCase();if(x==='septiembre')x='setiembre';r.mes=m[2]+'-'+String(MES_LARGO.indexOf(x)+1).padStart(2,'0')}
  const per=t.match(/(\d{2}\/\d{2}\/\d{4})\s*-\s*(\d{2}\/\d{2}\/\d{4})/);
  if(per){r.periodoInicio=fechaDMY(per[1]);r.periodoFin=fechaDMY(per[2])}
  if(m=t.match(/Fecha de emisi[oó]n:?\s*(?:\D{0,30})(\d{2}\/\d{2}\/\d{4})/i))r.emision=fechaDMY(m[1]);
  // El vencimiento aparece junto a la referencia de cobro (########-##############).
  if(m=t.match(/(\d{2}\/\d{2}\/\d{4})\s+\d{8}-\d{10,}/))r.vencimiento=fechaDMY(m[1]);
  if(!r.vencimiento){const usadas=[r.emision,r.periodoInicio,r.periodoFin];const otra=(t.match(/\d{2}\/\d{2}\/\d{4}/g)||[]).map(fechaDMY).find(f=>!usadas.includes(f));if(otra)r.vencimiento=otra}
  if(m=t.match(/Medidor:\s*Anterior:\s*Actual:\s*\S+\s+(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)/i)){r.lecturaAnterior=num(m[1]);r.lecturaActual=num(m[2]);r.m3=r2(r.lecturaActual-r.lecturaAnterior)}
  if(r.m3==null&&(m=t.match(/Volumen de Agua Potable\s+([\d.]+)\s*m3/i)))r.m3=num(m[1]);
  if(m=t.match(/(Volumen de Agua Potable[\s\S]*?Consumo del mes)\s+((?:-?[\d,]*\.\d{2}\s+)+)/i)){
    const labelsTxt=m[1],nums=m[2].trim().split(/\s+/).map(num);
    const alt=new RegExp(CONCEPTOS_AGUA.map(c=>'('+c[0]+')').join('|'),'gi');
    const labels=[];let last=0,x;
    while((x=alt.exec(labelsTxt))){const gap=labelsTxt.slice(last,x.index).trim();if(gap)labels.push({label:gap});const gi=x.slice(1).findIndex(v=>v!==undefined);labels.push({key:CONCEPTOS_AGUA[gi][1]});last=alt.lastIndex}
    if(labels.length===nums.length)labels.forEach((l,i)=>{if(!l.key)r.otros.push({label:l.label,monto:nums[i]});else if(l.key.startsWith('otros:'))r.otros.push({label:l.key.slice(6),monto:nums[i]});else r[l.key]=nums[i]});
  }
  if(r.total==null&&(m=t.match(/S\/\s*\**\s*([\d,]+\.\d{2})\s*Importe total a pagar/i)))r.total=num(m[1]);
  return r;
}
function chequeosAgua(d){
  const out=[];if(d.total==null)return out;
  const s=r2((d.volumen||0)+(d.alcantarillado||0)+(d.cargoFijo||0)+(d.cierre||0)+(d.reapertura||0)+(d.mora||0)+(d.igv||0)+(d.redondeoAnterior||0)+(d.redondeoActual||0)+sum(d.otros||[],o=>o.monto));
  if(Math.abs(s-d.total)>0.05)out.push(`Los conceptos suman ${fmtS(s)} y el total dice ${fmtS(d.total)}.`);
  if(d.lecturaAnterior!=null&&d.lecturaActual!=null&&d.m3!=null&&Math.abs(d.lecturaActual-d.lecturaAnterior-d.m3)>0.5)out.push('La diferencia de lecturas no coincide con los m³.');
  return out;
}
async function procesarAgua(files){
  for(const file of files){
    if(!/pdf$/i.test(file.type)&&!/\.pdf$/i.test(file.name)){toast(file.name+' no es un PDF.');continue}

}

/* ---------- Deshacer el último guardado ---------- */
// Se ofrece en el aviso que aparece tras guardar. Los cobros no se borran: se "vacían" con una entrada en su historial
// (borrar un cobro con pagos pide contraseña de administrador).
function deshacerUltimo(u=db&&db.deshacer){
  if(!u)return;if(db.deshacer===u)db.deshacer=null;
  const p=u.payload,previo=u.previo,ahora=new Date().toISOString();
  const entrada=d=>({cuando:ahora,deshecho:true,anterior:{monto:d&&d.montoCobrado!=null?d.montoCobrado:null,fecha:d?d.fechaCobro??null:null},nuevo:{monto:previo&&previo.montoCobrado!=null?previo.montoCobrado:null,fecha:previo?previo.fechaCobro??null:null}});
  let rev;
  if(previo){const data={...previo};delete data.id;
    const h=p.data&&Array.isArray(p.data.historialCobro)?p.data.historialCobro:null;if(h)data.historialCobro=h.concat([entrada(p.data)]);
    rev={action:'set',collection:p.collection,id:p.id,data}}
  else if(p.collection==='cobros')rev={action:'set',collection:'cobros',id:p.id,data:{...p.data,montoCobrado:null,fechaCobro:null,pagoTarde:null,tipoPago:null,historialCobro:(p.data.historialCobro||[]).concat([entrada(p.data)])}};
  else rev={action:'delete',collection:p.collection,id:p.id};
  db._write(rev,{sinDeshacer:true}).then(()=>toast('Cambio deshecho',{sinDeshacer:true})).catch(e=>toast('No se pudo deshacer: '+(e.message||e.code),{sinDeshacer:true}));
}

/* ---------- Lecturas del día 12 en secuencia ---------- */
function pendientesLectura(mes){
  const out=[],ord=deptos.slice().sort((a,b)=>(a.numero||0)-(b.numero||0));

    if(d.estado!=='desocupado'&&!lecturaDe(d.id,mes))out.push({dep:d.id,serv:'luz',txt:tituloDepto(d)+' luz'});

/* ---------- Consumos fuera de lo normal ---------- */
function consumoNormal(dep,mes,servicio){
  const ls=(servicio==='agua'?lecturasAguaDe(dep):lecturasDe(dep)).filter(l=>l.mes<mes).slice(-6);
  const vals=ls.map(l=>servicio==='agua'?m3De(l):Number(l.kwh)).filter(v=>v!=null&&!isNaN(v)&&v>0);
  return vals.length>=3?mediana(vals):null;
}
// Altos: al menos 40 % sobre lo normal y una diferencia que importe (20 kWh o 3 m³).
function consumosAltos(mes){
  const out=[];
  deptos.forEach(d=>{
    const l=lecturaDe(d.id,mes);if(l&&l.kwh!=null){const n=consumoNormal(d.id,mes,'luz');if(n&&l.kwh>n*1.4&&l.kwh-n>=20)out.push({d,serv:'luz',v:Number(l.kwh),n,u:'kWh'})}
    const la=lecturaAguaDe(d.id,mes),m=m3De(la);if(m!=null){const n=consumoNormal(d.id,mes,'agua');if(n&&m>n*1.4&&m-n>=3)out.push({d,serv:'agua',v:m,n,u:'m³'})}
  });
  return out;
}

    btn:ra.pagado?null:['Marcar pagado',()=>{const b={...ra};delete b.id;b.pagado=true;b.fechaPago=hoy;guardarReciboAgua(ra.id,b).then(()=>toast('Recibo de agua marcado como pagado')).catch(e=>toast('No se pudo guardar: '+(e.message||e.code)))}]})}
  const altos=consumosAltos(mes);
  if(altos.length)T.push({ok:false,urgente:false,t:'Revisar consumo alto',d:altos.map(a=>tituloDepto(a.d)+' '+a.serv+': '+fmtN(a.v,a.serv==='agua'?2:0)+' '+a.u+' (lo normal ~'+fmtN(a.n,a.serv==='agua'?1:0)+')').join(' · ')+'. Podría ser una fuga o un error de lectura.',btn:['Ver deptos',()=>irA('deptos')]});
  const ant=cobrosPendientesTodos().filter(p=>p.mes<mes);
  if(ant.length)T.push({ok:false,urgente:true,t:'Cobros pendientes de meses anteriores',d:fmtS(sum(ant,p=>p.falta))+' de '+(n=>n+' depto'+(n>1?'s':''))(new Set(ant.map(p=>p.d.id)).size)+'. En Cobros puedes enviarles un recordatorio.',btn:['Ver',()=>irA('cobros')]});
  return{mes,T};
}

// Ventana con todo el detalle de un mes: desglose, lecturas, fotos, recibos del edificio y cómo se calcula.
function abrirDetalleInquilino(dep,mes){
  const d=deptos.find(x=>x.id===dep),x=detalleCobro(dep,mes),a=calcAgua(mes),p=a&&!a.incompleto?a.porDepto[dep]:null;
  const l=lecturaDe(dep,mes),la=lecturaAguaDe(dep,mes),v=calcVerif(dep,mes);
  const rl=recibos.find(r=>r.id===mes),ra=aguaRecibos.find(r=>r.id===mes),prev=mesLargo(mesAnterior(mes));
  const fila=(t,det,val)=>val==null?'':`<tr><td>${t}${det?`<div class="small muted">${det}</div>`:''}</td><td>${fmtS(val)}</td></tr>`;
  const dlg=$('#dlg');
  dlg.innerHTML=`<div class="dlg-h"><h2>Detalle de ${mesLargo(mes)}</h2><button class="x" aria-label="Cerrar" data-close>×</button></div>
  <div class="dlg-b">
    <div class="scroll"><table class="detail"><tbody>
      ${fila('💡 Luz',l?`${l.lecturaAnterior!=null?fmtN(l.lecturaAnterior,1)+' → '+fmtN(l.lecturaActual,1)+' = ':''}${fmtN(l.kwh,2)} kWh${v?' · '+fmtN(v.pct*100,2)+'% del consumo medido del edificio':''}`:'',x.partes.luz)}
      ${fila('💧 Agua',p?(tipoAgua(d)==='sin_medidor'?'Consumo estimado: '+fmtN(p.m3,2)+' m³':`${la?fmtN(la.lecturaAnterior,3)+' → '+fmtN(la.lecturaActual,3)+' = '+fmtN(p.m3Leido,2)+' m³ medidos; ':''}${fmtN(p.m3,2)} m³ con tu parte del agua común`):'',x.partes.agua)}
      ${fila('Administración de luz','',x.partes.admLuz||null)}${fila('Administración de agua','',x.partes.admAgua||null)}${fila('Mantenimiento','',x.partes.mant||null)}
      ${fila('Mora del agua','Se reparte entre quienes aún no pagan '+prev,x.partes.atrasoAgua||null)}${fila('Intereses de la luz','Se reparte entre quienes aún no pagan '+prev,x.partes.atrasoLuz||null)}
      ${x.aFavor?`<tr><td>Saldo a favor del mes anterior</td><td>− ${fmtS(x.aFavor)}</td></tr>`:''}
      <tr class="sum"><td>Total del mes</td><td>${fmtS(x.neto)}</td></tr>
      ${x.cobrado!=null?`<tr><td>Pagado${x.cobro&&x.cobro.fechaCobro?' el '+fechaCorta(x.cobro.fechaCobro):''}</td><td>${fmtS(x.cobrado)}</td></tr>`:x.legado!=null?`<tr><td>Pagado (solo luz)</td><td>${fmtS(x.legado)}</td></tr>`:''}
      ${x.estado.cls!=='ok'&&x.falta>0?`<tr class="sum"><td>Por pagar</td><td>${fmtS(x.falta)}</td></tr>`:''}
    </tbody></table></div>
    ${x.cerrado?`<p class="small muted" style="margin-top:10px">Mes anterior al sistema actual: se muestra lo que pagaste, sin desglose.</p>`:""}
    ${x.faltan.length?`<div class="banner warn" style="margin-top:10px">Monto provisional: falta ${x.faltan.join(' y ')}.</div>`:''}
    ${(l&&l.fotoUrl)||(la&&la.fotoUrl)||(rl&&rl.pdfId)||(ra&&ra.pdfId)?`<h3 style="margin-top:16px">Fotos y recibos</h3><div class="row">
      ${l&&l.fotoUrl?`<a class="btn sm" href="${esc(l.fotoUrl)}" target="_blank" rel="noopener">📷 Medidor de luz</a>`:''}
      ${la&&la.fotoUrl?`<a class="btn sm" href="${esc(la.fotoUrl)}" target="_blank" rel="noopener">📷 Medidor de agua</a>`:''}
      ${rl&&rl.pdfId?`<button class="btn sm" data-inq-pdf="luz">Recibo de luz del edificio</button>`:''}
      ${ra&&ra.pdfId?`<button class="btn sm" data-inq-pdf="agua">Recibo de agua del edificio</button>`:''}</div>`:''}
    <details style="margin-top:16px"><summary class="small"><strong>¿Cómo se calcula?</strong></summary>
      <p class="small muted">La luz del edificio se reparte según el consumo de tu medidor comparado con la suma de todos los medidores internos. El agua se reparte según tu medidor; el agua que no marca ningún medidor interno (áreas comunes, diferencias de lectura) se reparte en proporción al consumo de cada uno. A eso se suma la administración. Si Sedapal o Luz del Sur cobran mora, intereses o reconexión por un atraso, se reparte en partes iguales entre quienes aún no han pagado el mes anterior.</p></details>
    <p class="small muted" style="margin-top:12px">¿Dudas sobre tu cobro? Escribe a la administración.</p>
  </div>
  <div class="dlg-f"><button class="btn primary" data-close>Cerrar</button></div>`;

let estadoRec=null;
function mensajeRec(e){const m=String(e&&(e.message||e.code)||'');

async function abrirRecordatorio(){
  if(!db)return;
  const c=$('#dlg');

    const r=estadoRec||{activo:false,dia:12,hora:9};
    const horas=[];for(let i=6;i<=21;i++)horas.push('<option value="'+i+'"'+(i===r.hora?' selected':'')+'>'+i+':00</option>');
    const permiso=aviso==='permiso'||r.error==='permiso';

    '<div class="dlg-b">'+
      '<p style="margin-top:0">Un evento mensual en tu Google Calendar te avisa en el celular que toca tomar la foto del medidor de cada departamento.</p>'+
      (r.activo?'<div class="banner info" style="margin-bottom:14px">Activo: el día <strong>'+r.dia+'</strong> de cada mes a las <strong>'+r.hora+':00</strong>.</div>':'<div class="banner warn" style="margin-bottom:14px">Todavía no está activado.</div>')+
      (permiso?'<div class="banner alert" style="margin-bottom:14px">Falta autorizar Google Calendar (una sola vez). En el <a href="'+esc(infoLinks&&infoLinks.editor||'#')+'" target="_blank" rel="noopener">editor de Apps Script</a>, elige la función <strong>crearRecordatorioMedidores</strong>, pulsa <strong>Ejecutar</strong> y acepta el permiso de Calendar. Eso ya crea el recordatorio.</div>':'')+
      (aviso&&!permiso?'<div class="banner alert" style="margin-bottom:14px">'+esc(aviso)+'</div>':'')+
      '<div class="form-rec"><label class="f">Día del mes<input type="number" id="rec-dia" min="1" max="28" value="'+r.dia+'" inputmode="numeric"></label>'+
      '<label class="f">Hora del aviso<select id="rec-hora">'+horas.join('')+'</select></label></div>'+
      '<p class="muted small" style="margin:12px 0 0">Tus recibos se leen entre el 12 y el 16 de cada mes: tomar las fotos el día 12 mantiene los periodos alineados con el recibo.</p>'+
    '</div>'+
    '<div class="dlg-f">'+(r.activo?'<button class="btn danger" id="rec-quitar" style="margin-right:auto">Quitar</button>':'')+
      '<button class="btn" data-close>Cerrar</button><button class="btn primary" id="rec-guardar">'+(r.activo?'Guardar cambios':'Activar recordatorio')+'</button></div>';
    c.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>c.close());
    const accion=async(op,btn,txt)=>{btn.disabled=true;btn.textContent=txt;
      try{estadoRec=await db._post({action:'recordatorio',op,dia:Number(c.querySelector('#rec-dia').value),hora:Number(c.querySelector('#rec-hora').value)});
        toast(op==='quitar'?'Recordatorio quitado':'Recordatorio guardado en Google Calendar');pintar();if(tabActual==='ruta')renderRuta()}
      catch(e){pintar(mensajeRec(e))}};
    c.querySelector('#rec-guardar').onclick=e=>accion('crear',e.currentTarget,'Guardando…');
    const q=c.querySelector('#rec-quitar');if(q)q.onclick=e=>accion('quitar',e.currentTarget,'Quitando…');
  };
  c.innerHTML='<div class="dlg-b"><p class="muted" style="margin:0">Consultando Google Calendar…</p></div>';

}

// En GitHub Pages → fetch a la API /exec. Servida por Apps Script (respaldo) → google.script.run.
// Ojo: las URL van con \/\/ porque Apps Script corta los // dentro de textos al servir la página.
const API_URL='https:\/\/script.google.com/macros/s/AKfycbxEY9ZVcTbfzaIAUq2RZ9rxCzOClJ5bFNlilWnQVq-SLQydVvBnqoFzTkwgi0yiTq_J/exec';
const EN_APPS_SCRIPT = typeof google!=='undefined' && !!(google.script&&google.script.run);
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
const APPS_SCRIPT_URL = EN_APPS_SCRIPT ? 'apps-script' : (lsGet('recibosluz_url') || API_URL);
// Token de sesión que devuelve el servidor al validar el código de acceso; se recuerda en este dispositivo.
let tokenAcceso=lsGet('recibos_token');
function fileToBase64(file){return new Promise((ok,err)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=err;r.readAsDataURL(file)})}

function llamarApi(base,payload){
  if(EN_APPS_SCRIPT)return new Promise((ok,err)=>google.script.run
    .withSuccessHandler(ok)
    .withFailureHandler(e=>err(Object.assign(new Error(e&&e.message||'error'),{code:e&&e.message||'error'})))
    .api(payload));
  // text/plain evita la petición previa CORS, que Apps Script no responde.
  return fetch(base,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
    .then(r=>r.json()).then(j=>{if(!j.ok)throw Object.assign(new Error(j.error||'error'),{code:j.error});return j.result});
}

function mostrarLogin(aviso=''){
  const c=$('#dlgLogin');if(c.open)return;
  c.innerHTML=`<form class="dlg-b" style="padding:26px 22px" id="login-form">
    <h2 style="margin:0 0 4px">Recibos Jardín</h2>
    <p class="muted small" style="margin:0 0 16px">${esc(aviso||'Escribe tu código de acceso: el de administración o el de tu departamento. Se recordará en este dispositivo.')}</p>
    <label class="f">Código de acceso<input id="login-codigo" type="password" autocomplete="current-password" required></label>
    <p class="small" id="login-error" style="color:var(--red);min-height:1.5em;margin:8px 0 0"></p>
    <button class="btn primary" type="submit" style="width:100%;justify-content:center;margin-top:6px">Entrar</button>
  </form>`;
  c.addEventListener('cancel',e=>e.preventDefault()); // no se puede cerrar sin entrar
  c.querySelector('#login-form').onsubmit=async e=>{
    e.preventDefault();
    const btn=c.querySelector('button[type=submit]'),err=c.querySelector('#login-error');
    btn.disabled=true;btn.textContent='Entrando…';err.textContent='';
    try{
      const r=await llamarApi(APPS_SCRIPT_URL,{action:'login',codigo:c.querySelector('#login-codigo').value});
      // Si cambia quién entra (administración o un depto), se borra la copia local y se recarga la vista.
      const antes=(lsGet('recibos_rol')||'admin')+'|'+(lsGet('recibos_depto')||''),ahora=(r.rol||'admin')+'|'+(r.depto||'');
      tokenAcceso=r.token;lsSet('recibos_token',tokenAcceso);lsSet('recibos_rol',r.rol||'admin');lsSet('recibos_depto',r.depto||null);c.close();
      if(antes!==ahora){lsSet('recibos_cache',null);if(db){location.reload();return}}
      if(db)db._poll(true);else conectar();
    }catch(ex){err.textContent=mensajeLogin(ex);btn.disabled=false;btn.textContent='Entrar'}
  };
  c.showModal();setTimeout(()=>c.querySelector('#login-codigo').focus(),0);
}
function sesionCaducada(){tokenAcceso=null;lsSet('recibos_token',null);mostrarLogin('El código de acceso cambió o la sesión se cerró. Escríbelo de nuevo.')}

class SheetsDB{
  constructor(base){this.base=base;this.subs={};this.timer=null;this.ultimo=null;this.enVuelo=false;this.repetir=false;this.cola=Promise.resolve();this.pendientes=[]}
  async _post(payload){
    try{return await llamarApi(this.base,{...payload,token:tokenAcceso})}
    catch(e){if(String(e.message).includes('no_autorizado'))sesionCaducada();throw e}
  }
  // Un solo sondeo a la vez para todas las colecciones (o solo las indicadas). Si ya hay uno en curso, se agenda otro
  // al terminar: así las consultas nunca se amontonan en el servidor ni hacen esperar a los guardados.
  async _poll(forzar,soloEstas){
    if(document.hidden&&!forzar)return;
    if(this.enVuelo){this.repetir=true;return}
    const names=(soloEstas&&this.ultimo?soloEstas:Object.keys(this.subs)).filter(n=>this.subs[n]);if(!names.length)return;
    this.enVuelo=true;
    try{
      const all=await this._post({action:'listAll',collections:names});
      if(!datosListos){datosListos=true;marcarEstadoSync()}
      // Si nada cambió desde el último sondeo, no se redibuja (así no se pierde lo que la persona tiene abierto o escribiendo).
      const nuevo={...(this.ultimo||{}),...all},firma=JSON.stringify(nuevo);
      if(firma!==this._firma||this.pendientes.length){this._firma=firma;this.ultimo=nuevo;this._entregar(this.ultimo);try{localStorage.setItem('recibos_cache',firma)}catch(e){}}
    }catch(e){names.forEach(n=>this.subs[n].forEach(s=>s.errCb&&s.errCb({code:e.code||'network'})))}
    finally{this.enVuelo=false;if(this.repetir){this.repetir=false;setTimeout(()=>this._poll(true),50)}}
  }
  // Entrega a la app los datos, con los guardados aún en camino aplicados encima (para que no "reboten").
  _entregar(all){
    // Las secciones plegables abiertas en la pestaña actual se vuelven a abrir después de redibujar.
    const tab=document.getElementById('tab-'+tabActual),clave=d=>{const s=d.querySelector('summary');return s?s.textContent.trim().slice(0,40):''};
    const abiertos=tab?[...tab.querySelectorAll('details[open]')].map(clave):[];
    const vista=this.pendientes.length?JSON.parse(JSON.stringify(all)):all;
    this.pendientes.forEach(p=>SheetsDB.aplicar(vista,p));
    Object.keys(this.subs).forEach(n=>{const docs=vista[n]||[];this.subs[n].forEach(s=>{calcAgua.memo=null;s.cb({docs:docs.map(d=>({id:d.id,data:()=>d}))})})});
    if(tab&&abiertos.length)tab.querySelectorAll('details').forEach(d=>{if(abiertos.includes(clave(d)))d.open=true});
  }
  static aplicar(all,p){
    const col=all[p.collection]=all[p.collection]||[];const i=col.findIndex(d=>d.id===p.id);
    if(p.action==='delete'){if(i>=0)col.splice(i,1)}
    else if(p.action==='set'){const d={...p.data,id:p.id};if(i>=0)col[i]=d;else col.push(d)}
    else if(p.action==='update'&&i>=0)col[i]={...col[i],...p.data,id:p.id};
  }
  // Al abrir: muestra al instante la última copia guardada en este dispositivo mientras llegan los datos frescos.
  mostrarCopiaLocal(){try{const c=JSON.parse(lsGet('recibos_cache')||'null');if(c){this.ultimo=c;this._entregar(c)}}catch(e){}}
  _schedule(){
    clearTimeout(this._kick);this._kick=setTimeout(()=>this._poll(true),0);
    if(!this.timer){this.timer=setInterval(()=>this._poll(),10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)this._poll()})}
  }
  collection(name){
    return{onSnapshot:(cb,errCb)=>{
      const s={cb,errCb};(this.subs[name]=this.subs[name]||[]).push(s);this._schedule();
      return()=>{this.subs[name]=this.subs[name].filter(x=>x!==s);if(!this.subs[name].length)delete this.subs[name]};
    }};
  }
  // Guardado optimista: el cambio se ve al instante y se envía en segundo plano, en orden. Si el servidor lo rechaza,
  // se deshace y se avisa. Las operaciones con contraseña de administrador sí esperan la respuesta.
  async _write(payload,opts={}){
    if(!datosListos)throw new Error('Todavía se están cargando los datos. Intenta de nuevo en unos segundos.');
    const simple=['set','update','delete'].includes(payload.action)&&!payload.clave&&this.ultimo;
    if(!simple){this.deshacer=null;const r=await this._post(payload);this._refrescar(payload.collection);return r}
    if(!opts.sinDeshacer){const prev=this._vistaCol(payload.collection).find(d=>d.id===payload.id);this.deshacer={payload,previo:prev?JSON.parse(JSON.stringify(prev)):null,t:Date.now()}}
    this.pendientes.push(payload);this._entregar(this.ultimo);marcarGuardando(this.pendientes.length);
    this.cola=this.cola.then(()=>this._post(payload)).then(()=>{
      SheetsDB.aplicar(this.ultimo,payload);
      this.pendientes=this.pendientes.filter(p=>p!==payload);marcarGuardando(this.pendientes.length);
      this._refrescar(payload.collection);
    }).catch(e=>{
      if(this.deshacer&&this.deshacer.payload===payload)this.deshacer=null;
      this.pendientes=this.pendientes.filter(p=>p!==payload);marcarGuardando(this.pendientes.length);
      this._entregar(this.ultimo);
      avisarNoGuardado(e);
    });
    return{id:payload.id,enCamino:true};
  }
  // Cómo se ve ahora una colección, con los guardados en camino aplicados (para saber qué había antes de un cambio).
  _vistaCol(c){const v={[c]:JSON.parse(JSON.stringify((this.ultimo&&this.ultimo[c])||[]))};this.pendientes.filter(p=>p.collection===c).forEach(p=>SheetsDB.aplicar(v,p));return v[c]}
  // Tras guardar, solo se recarga la colección que cambió (varias seguidas se agrupan).
  _refrescar(col){this._porRefrescar=[...new Set([...(this._porRefrescar||[]),col].filter(Boolean))];clearTimeout(this._kick);
    this._kick=setTimeout(()=>{const c=this._porRefrescar;this._porRefrescar=[];this._poll(true,c.length?c:null)},300)}
  doc(path){const [collection,id]=path.split('/');return{
    set:(data,clave,opts)=>this._write({action:'set',collection,id,data,clave},opts),
    update:(data,clave,opts)=>this._write({action:'update',collection,id,data,clave},opts),
    delete:(clave,opts)=>this._write({action:'delete',collection,id,clave},opts),
  }}
}
function marcarGuardando(n){const e=$('#estado-sync');if(e)e.textContent=n?(n>1?'Guardando '+n+' cambios…':'Guardando…'):(datosListos?'✓ Guardado':'Actualizando…');clearTimeout(marcarGuardando._t);if(!n)marcarGuardando._t=setTimeout(()=>{if(e&&!db.pendientes.length)e.textContent=''},2500)}
function avisarNoGuardado(e){
  const a=$('#aviso-guardado');a.hidden=false;
  a.textContent='No se pudo guardar un cambio y se deshizo: '+(mensajeClave(e)||e.message||e.code||'error de conexión')+'. Vuelve a intentarlo.';
  clearTimeout(avisarNoGuardado._t);avisarNoGuardado._t=setTimeout(()=>{a.hidden=true},12000);
}

function crearAssets(db){return{
  // opts.carpeta: subcarpetas dentro de RECIBOS_JARDIN, p. ej. ['Fotos medidores','Depto 3']; opts.nombre: nombre del archivo en Drive.
  upload:async(file,opts)=>{const base64=await fileToBase64(file);const r=await db._post({action:'upload',base64,mimeType:opts?.type||file.type,filename:opts?.nombre||file.name,carpeta:opts?.carpeta||[]});return{id:r.id,url:r.url}},
  delete:async(id)=>db._post({action:'deleteFile',fileId:id}),

function crearDownloads(){return{
  save:async({filename,data})=>{const blob=new Blob([data],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}

let tesseractCargado=null;
function cargarTesseract(){if(!tesseractCargado)tesseractCargado=cargarScript('https:\/\/cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js');return tesseractCargado}
// Las fotos del celular pesan 3–12 MB: se reducen a ~1600 px en JPEG antes de leerlas y subirlas.
function cargarImagen(blob){return new Promise((ok,err)=>{const url=URL.createObjectURL(blob);const img=new Image();img.onload=()=>{URL.revokeObjectURL(url);ok(img)};img.onerror=()=>{URL.revokeObjectURL(url);err(new Error('imagen_invalida'))};img.src=url})}
async function reducirImagen(file,maxLado=1600,calidad=0.85){
  const img=await cargarImagen(file);
  const k=Math.min(1,maxLado/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return new Promise(ok=>c.toBlob(b=>ok(b||file),'image/jpeg',calidad));
}
// Copia en escala de grises con contraste alto: el OCR distingue mejor los dígitos del tambor del medidor.
async function prepararParaOCR(blob){
  const img=await cargarImagen(blob);
  const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
  const ctx=c.getContext('2d');ctx.filter='grayscale(1) contrast(1.6)';ctx.drawImage(img,0,0);
  return c;
}
// Elige el número más probable. Con lectura anterior: el menor valor ≥ anterior y ≤ anterior+3000 kWh,
// probando también con el último dígito como decimal (muchos medidores lo muestran en una casilla roja).
function elegirLectura(texto,anterior){
  const tokens=(texto.match(/\d[\d.,]*\d|\d/g)||[]).map(t=>t.replace(/,/g,'.').replace(/\.(?=.*\.)/g,''));
  const cands=[];
  tokens.forEach((t,i)=>{const n=parseFloat(t);if(isNaN(n))return;cands.push({n,dig:t.replace('.','').length});if(!t.includes('.')&&t.length>=2)cands.push({n:n/10,dig:t.length});
    // "12583 5" → 12583.5: 1–2 dígitos sueltos justo después de un entero suelen ser la casilla decimal (roja).
    const sig=tokens[i+1];
    if(sig&&sig.length<=3&&!t.includes('.')&&t.length>=3&&new RegExp('(^|\\D)'+t+'\\s+'+sig+'(?!\\d)').test(texto))cands.push({n:parseFloat(t+'.'+sig),dig:t.length+sig.length,unido:true})});
  if(!cands.length)return null;
  if(anterior!=null){
    const peso=c=>(c.n-anterior)-(c.unido?1:0);
    const ok=cands.filter(c=>c.n>=anterior&&c.n-anterior<=3000).sort((a,b)=>peso(a)-peso(b));
    return ok.length?ok[0].n:null; // nada coherente con la lectura anterior: mejor que la persona lo escriba
  }
  const largos=cands.slice().sort((a,b)=>b.dig-a.dig);
  return largos[0].dig>=3?largos[0].n:null;
}
let ocrWorker=null;
async function obtenerWorkerOCR(){
  if(!ocrWorker)ocrWorker=(async()=>{await cargarTesseract();const w=await window.Tesseract.createWorker('eng');// PSM 11 = texto disperso: detecta los dígitos grandes de los tambores, que el modo por defecto ignora.
    await w.setParameters({tessedit_char_whitelist:'0123456789.,',tessedit_pageseg_mode:'11',preserve_interword_spaces:'1'});return w})();
  try{return await ocrWorker}catch(e){ocrWorker=null;throw e}
}
function crearSampleOCR(){return{
  soloOCR:true,
  limits:async()=>({images:true}),
  json:async(prompt,{images:file,anterior=null}={})=>{
    const worker=await obtenerWorkerOCR();
    const {data}=await worker.recognize(await prepararParaOCR(file));
    return{lectura:elegirLectura((data&&data.text)||'',anterior)};
  }
}}

  $('#aviso-db').hidden=true;

  const reVista=()=>{if(tabActual==='resumen')renderResumen();if(tabActual==='inquilino')renderInquilino()};
  db.collection('recibos').onSnapshot(snap=>{$('#aviso-db').hidden=true;recibos=snap.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>String(a.id).localeCompare(String(b.id)));renderTodo()},err=>{if(String(err.code).includes('no_autorizado'))return;$('#aviso-db').hidden=false;$('#aviso-db').textContent='No se pudo conectar con la Hoja de cálculo ('+(err.code||'error')+'). Revisa tu conexión a internet; la app reintenta sola cada pocos segundos.'});
  db.collection('departamentos').onSnapshot(snap=>{deptos=snap.docs.map(x=>({id:x.id,...x.data()}));if(tabActual==='deptos')renderDeptos();if(tabActual==='cobros')renderCobros();reVista()});
  db.collection('lecturas').onSnapshot(snap=>{lecturas=snap.docs.map(x=>({id:x.id,...x.data()}));if(tabActual==='deptos')renderDeptos();reVista()});
  db.collection('config').onSnapshot(snap=>{const c=snap.docs.find(x=>x.id==='general');config=c?{diaCorte:12,mantenimiento:5,...c.data()}:{diaCorte:12,mantenimiento:5};if(tabActual==='deptos')renderDeptos();reAgua()});
  const reAgua=()=>{if(tabActual==='agua')renderAgua();if(tabActual==='cobros')renderCobros();reVista()};
  db.collection('agua_recibos').onSnapshot(snap=>{aguaRecibos=snap.docs.map(x=>({id:x.id,...x.data()}));reAgua()});
  db.collection('lecturas_agua').onSnapshot(snap=>{lecturasAgua=snap.docs.map(x=>({id:x.id,...x.data()}));reAgua();if(tabActual==='deptos')renderDeptos()});
  db.collection('cobros').onSnapshot(snap=>{cobros=snap.docs.map(x=>({id:x.id,...x.data()}));reAgua();if(tabActual==='deptos')renderDeptos()});
  db.collection('cargos').onSnapshot(snap=>{cargosMes=snap.docs.map(x=>({id:x.id,...x.data()}));reAgua()});
  if(!esInquilino())db.collection('tareas').onSnapshot(snap=>{tareasHechas={};snap.docs.forEach(x=>{tareasHechas[x.id]=!!x.data().hecho});if(tabActual==='ruta')renderRuta();if(tabActual==='cobros')renderCobros();reVista()});
  renderTodo();db.mostrarCopiaLocal();marcarEstadoSync();
  if(tabActual==='reportes')renderReportes();
}
